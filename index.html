<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3d7a2c">
<title>Mon petit District – Le foot amateur en direct</title>
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="description" content="Le foot amateur en direct : scores, classement et calendrier de la D3 Haute-Marne – Poule A.">
<meta property="og:title" content="Mon petit District – Le foot amateur en direct">
<meta property="og:description" content="Scores en direct, classement et calendrier de la D3 Haute-Marne – Poule A.">
<meta property="og:image" content="https://dev52-fr.github.io/mon-petit-district/og.jpg">
<meta property="og:url" content="https://dev52-fr.github.io/mon-petit-district/">
<meta name="twitter:card" content="summary_large_image">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Petit District">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
  // Thème : choix enregistré, sinon celui du téléphone
  (function () { let t = null; try { t = localStorage.getItem("theme") } catch (e) {}
    if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t; })();
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f4f8; --card:#fff; --line:#e6e9f0; --txt:#0f172a; --mut:#64748b;
    --navy:#0a2463; --navy2:#1e3a8a; --blue:#2563eb; --green:#16a34a; --lime:#22c55e;
    --red:#e11d48; --amber:#f59e0b; --soft:#eef2ff;
    --cond:"Barlow Condensed",system-ui,sans-serif;
    --ink:#0a2463; --live-bg:#fff1f2; --rep-bg:#fff7ed; --rep-txt:#c2410c; --rep-line:#fed7aa; --red-line:#fecdd3; --chip-on:#0a2463;
    color-scheme:light;
  }
  /* ---------- Mode sombre ---------- */
  :root[data-theme=dark]{
    --bg:#0b1120; --card:#131c2f; --line:#24304a; --txt:#e6ebf5; --mut:#8e9ab3; --soft:#1b2848;
    --ink:#b9cdff; --live-bg:#2a1420; --rep-bg:#2b1a0e; --rep-txt:#fdba74; --rep-line:#5b3416; --red-line:#5c1f2e; --chip-on:#2563eb;
    --navy2:#1e3a8a; color-scheme:dark;
  }
  :root[data-theme=dark] header{border-bottom-color:var(--line)}
  :root[data-theme=dark] .form .N{background:#56627a}
  :root[data-theme=dark] dialog::backdrop{background:rgba(0,0,0,.6)}
  :root[data-theme=dark] nav{box-shadow:0 -4px 20px rgba(0,0,0,.4)}
  .theme-btn{margin-left:auto;width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;padding:0}
  .theme-btn svg{width:20px;height:20px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* Correctif iOS (app sur l'écran d'accueil) : une page trop courte décale la barre du bas.
     On force la page à couvrir tout l'écran, barre d'état comprise. */
  html{min-height:calc(100% + env(safe-area-inset-top))}
  body{min-height:100vh;min-height:100dvh}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 Inter,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
  button{font-family:inherit;cursor:pointer}

  /* ---------- En-tête ---------- */
  header{background:var(--card);color:var(--ink);padding:12px 18px 14px;border-bottom:1px solid var(--line)}
  header>*{max-width:612px;margin-left:auto;margin-right:auto}
  .banner{position:relative;overflow:hidden;background:#3d7a2c;padding-top:env(safe-area-inset-top)}
  .banner::before{content:"";position:absolute;inset:-30px;background:url(banner.jpg) center 20%/auto 300%;filter:blur(16px) saturate(1.1)}
  .banner img{position:relative;display:block;width:100%;height:auto;max-height:260px;object-fit:cover;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 30px);mask-image:linear-gradient(to bottom,transparent 0,#000 30px)}
  .brand{display:flex;align-items:center;gap:14px}
  .brand .logo{width:58px;height:58px;border-radius:15px;background:linear-gradient(160deg,#3fd56f,#22c55e);display:grid;place-items:center;flex:none;box-shadow:0 4px 12px rgba(34,197,94,.3)}
  .brand .logo img{width:46px;height:auto;display:block}
  .wm{display:flex;flex-direction:column;align-items:flex-start;line-height:1;font-family:Poppins,M,sans-serif;font-weight:700;color:var(--ink)}
  .wm-mon{font-size:11px;letter-spacing:.45em;color:var(--mut);margin-bottom:4px}
  .wm-p{font-size:38px;letter-spacing:.03em}
  .wm-p i{display:inline-block;transform:skewX(-14deg);font-style:normal}
  .wm-d{display:flex;align-items:center;gap:.45em;font-size:12px;letter-spacing:.42em;margin-top:5px}
  .wm-d::before,.wm-d::after{content:"";width:1.6em;height:.18em;border-radius:.1em;background:var(--green)}
  /* ---------- Écran d'ouverture ---------- */
  #splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:opacity .45s ease}
  #splash img{width:min(56vw,240px);height:auto;border-radius:22%;box-shadow:0 18px 50px rgba(34,197,94,.35);animation:pop .6s ease-out}
  #splash.out{opacity:0;pointer-events:none}
  @keyframes pop{from{transform:scale(.85);opacity:0}}
  .disclaimer{text-align:center;font-size:11px;color:var(--mut);margin:22px 10px 6px}
  .league{margin-top:6px;font-size:13px;color:var(--mut)}
  main{padding:14px 14px 20px;max-width:640px;margin:0 auto}

  /* ---------- Navigation ---------- */
  nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5;box-shadow:0 -4px 20px rgba(15,23,42,.05)}
  nav button{flex:1;background:none;border:0;color:var(--mut);padding:9px 0 11px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
  nav svg{width:22px;height:22px}
  nav button.on{color:var(--blue)}
  nav .dot{position:absolute;margin-left:18px;margin-top:-2px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--card)}

  /* ---------- Éléments communs ---------- */
  .sec{display:flex;align-items:center;justify-content:space-between;margin:20px 4px 10px}
  .sec h2{margin:0;font:700 19px/1 var(--cond);text-transform:uppercase;letter-spacing:.6px}
  .card{background:var(--card);border-radius:16px;box-shadow:0 1px 3px rgba(15,23,42,.06),0 1px 0 var(--line);margin-bottom:10px;overflow:hidden}
  .pad{padding:14px}
  .btn{background:var(--card);color:var(--txt);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font-size:15px;font-weight:700}
  .btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.g{background:var(--green);border-color:var(--green);color:#fff}
  .btn.r{background:var(--card);border-color:var(--red-line);color:var(--red)}
  .btn.dark{background:var(--navy);border-color:var(--ink);color:#fff}
  .btn.full{width:100%}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .live{color:var(--red);font-weight:800;display:inline-flex;align-items:center;gap:5px;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.2}}
  .empty{color:var(--mut);text-align:center;padding:22px;font-size:14px}
  .note{font-size:12px;color:var(--mut);margin:10px 4px}

  /* ---------- Filtres ---------- */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--txt);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600}
  .chip.on{background:var(--chip-on);border-color:var(--chip-on);color:#fff}
  .chip .n{display:inline-block;min-width:18px;margin-left:4px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px}

  /* ---------- Carte match (liste) ---------- */
  .m{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 14px;color:inherit}
  .m+.m{border-top:1px solid var(--line)}
  .m .top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);margin-bottom:8px}
  .m .team{display:flex;align-items:center;gap:10px;padding:3px 0}
  .m .team .nm{flex:1;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .m .team .g{font:800 24px/1 var(--cond);min-width:22px;text-align:right}
  .m .team.lose .nm,.m .team.lose .g{color:#94a3b8;font-weight:500}
  .m .kick{font:700 20px/1 var(--cond);color:var(--ink)}
  .m.islive{background:linear-gradient(90deg,var(--live-bg) 0,var(--card) 40%)}
  .rep{display:inline-block;background:var(--card)7ed;color:#c2410c;border:1px solid #fed7aa;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;margin-left:4px;vertical-align:1px}
  .soon{color:var(--amber);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  .bar{height:3px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--red);border-radius:2px}

  /* ---------- Page match ---------- */
  .hero{background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;border-radius:20px;padding:14px 14px 18px;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:200px;height:200px;border-radius:50%;border:2px solid rgba(255,255,255,.07)}
  .hero .back{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;padding:6px 12px;font-weight:600;font-size:13px}
  .hero .tp{display:flex;justify-content:space-between;align-items:center}
  .hero .lg{font-size:12px;opacity:.75;margin:12px 0 6px;text-align:center}
  .duel{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center}
  .duel .tm{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:14px;line-height:1.2}
  .duel .sc{font:800 64px/1 var(--cond);letter-spacing:2px;font-variant-numeric:tabular-nums}
  .duel .sc small{font-size:40px;opacity:.5;margin:0 4px}
  .st{display:flex;justify-content:center;margin-top:8px}
  .badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px;letter-spacing:.5px}
  .badge.lv{background:var(--red);color:#fff}
  .badge.lv::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--card);animation:pulse 1.2s infinite}
  .badge.mt{background:var(--amber);color:#451a03}
  .badge.fin{background:rgba(255,255,255,.15);color:#fff}
  .badge.av{background:rgba(255,255,255,.15);color:#fff;font-weight:600}
  .hero .bar{background:rgba(255,255,255,.15);margin:14px 6px 0;height:4px}
  .hero .bar i{background:var(--lime)}
  .lieu{text-align:center;font-size:12px;opacity:.85;margin-top:8px}
  .lieu a{color:#bbf7d0;text-decoration:none;font-weight:600}
  .ticks{display:flex;justify-content:space-between;font-size:10px;opacity:.6;margin:4px 6px 0}

  .actions{padding:14px}
  .goal{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;border-radius:14px;border:0;background:var(--soft);color:var(--ink);font-weight:700;font-size:13px}
  .goal b{font:800 22px/1 var(--cond);text-transform:uppercase}
  .goal:active{transform:scale(.97)}
  .mini{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:12px;font-weight:600;color:var(--txt)}
  .mini span{font-size:18px}

  .tl{position:relative;padding:8px 14px}
  .tl::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--line);transform:translateX(-1px)}
  .ev{display:grid;grid-template-columns:1fr 44px 1fr;align-items:center;padding:7px 0;position:relative}
  .ev .min{justify-self:center;background:var(--card);border:2px solid var(--line);border-radius:999px;font:700 13px/1 var(--cond);padding:5px 0;width:40px;text-align:center;z-index:1}
  .ev .tx{font-size:14px;display:flex;align-items:center;gap:6px}
  .ev .tx.h{justify-content:flex-end;text-align:right}
  .ev .tx small{display:block;color:var(--mut);font-size:11px}
  .ev.g .min{border-color:var(--green);color:var(--green)}
  .phase{text-align:center;margin:6px 0;position:relative;z-index:1}
  .phase span{background:var(--bg);color:var(--mut);font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:3px 10px;border-radius:999px}

  /* ---------- Classement ---------- */
  table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
  th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;text-align:center;padding:10px 3px;border-bottom:1px solid var(--line)}
  td{text-align:center;padding:9px 3px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:0}
  td.pos{width:30px;font:700 16px/1 var(--cond);position:relative}
  td.pos::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px}
  tr.up1 td.pos::before{background:var(--green)}
  tr.dn1 td.pos::before{background:var(--red)}
  td.n,th.n{text-align:left}
  td.n .w{display:flex;align-items:center;gap:8px;font-weight:600}
  td.n .w span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
  td.pts{font:800 18px/1 var(--cond);color:var(--ink)}
  tr.lv td{background:var(--card)1f2}
  .mv{font-size:10px;font-weight:800}
  .mv.u{color:var(--green)} .mv.d{color:var(--red)}
  .form{display:flex;gap:3px;justify-content:center}
  .form i{width:16px;height:16px;border-radius:4px;font:700 10px/16px Inter;color:#fff;font-style:normal}
  .form .V{background:var(--green)} .form .N{background:#94a3b8} .form .D{background:var(--red)}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin:10px 4px}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .legend .a::before{background:var(--green)} .legend .b::before{background:var(--red)} .legend .c::before{background:var(--red-line)}
  .hide-s{display:none}
  @media(min-width:430px){.hide-s{display:table-cell}}

  /* ---------- Réglages ---------- */
  label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 5px}
  input,select{width:100%;background:var(--card);color:var(--txt);border:1.5px solid var(--line);border-radius:12px;padding:11px;font-size:16px;font-family:inherit}
  input:focus,select:focus{outline:none;border-color:var(--blue)}
  .trow{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--line)}
  .trow input[type=text]{flex:1;padding:8px 10px}
  .trow input[type=color]{width:34px;height:34px;padding:2px;border-radius:9px;flex:none}
  .lg-btn{margin:0;padding:2px;border-radius:8px;border:1.5px dashed var(--line);cursor:pointer;display:flex}
  .x{background:none;border:0;color:var(--red);font-size:18px;padding:6px}

  dialog{background:var(--card);color:var(--txt);border:0;border-radius:20px;width:min(92vw,420px);padding:18px;box-shadow:0 20px 60px rgba(15,23,42,.3)}
  dialog::backdrop{background:rgba(10,36,99,.45);backdrop-filter:blur(2px)}
  dialog h3{margin:0 0 4px;font:800 22px/1.1 var(--cond);text-transform:uppercase}
  .seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
  .seg label{flex:1;margin:0;text-align:center;padding:9px 4px;border-radius:9px;font-size:13px;color:var(--txt);cursor:pointer}
  .seg input{display:none}
  .seg input:checked+label{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--ink)}

  /* ---------- Tuto « écran d'accueil » ---------- */
  .install{position:fixed;left:10px;right:10px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:20;background:var(--card);border-radius:18px;
    box-shadow:0 12px 40px rgba(10,36,99,.28);padding:14px 14px 12px;max-width:460px;margin:0 auto;animation:up .35s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:0}}
  .install .hd{display:flex;align-items:center;gap:12px}
  .install .hd img{width:46px;height:46px;border-radius:11px}
  .install .hd b{display:block;font:800 18px/1.1 var(--cond);text-transform:uppercase;color:var(--ink)}
  .install .hd span{font-size:13px;color:var(--mut)}
  .install ol{margin:12px 0 10px;padding-left:22px;font-size:14px;line-height:1.55}
  .install .ico{display:inline-flex;vertical-align:-4px;background:var(--soft);border-radius:6px;padding:2px 4px;color:var(--blue)}
  .install .ico svg{width:16px;height:16px}
  .install .cl{position:absolute;top:8px;right:8px;background:none;border:0;font-size:20px;color:var(--mut);padding:4px 8px}

  /* ---------- Volets dépliants ---------- */
  details.fold{margin:12px 0 0}
  details.fold summary{list-style:none;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:13px 14px;cursor:pointer;
    box-shadow:0 1px 3px rgba(15,23,42,.06),0 1px 0 var(--line)}
  details.fold summary::-webkit-details-marker{display:none}
  details.fold summary h2{margin:0;flex:1;font:700 18px/1 var(--cond);text-transform:uppercase;letter-spacing:.5px}
  details.fold .cnt{font-size:12px;color:var(--mut);white-space:nowrap}
  details.fold .chev{width:9px;height:9px;border-right:2.5px solid var(--mut);border-bottom:2.5px solid var(--mut);transform:rotate(45deg);margin:-4px 4px 0 2px;transition:transform .2s}
  details.fold[open] .chev{transform:rotate(-135deg);margin-top:4px}
  details.fold[open] summary{border-radius:14px 14px 0 0;box-shadow:none;border-bottom:1px solid var(--line)}
  details.fold[open] .card{border-radius:0 0 16px 16px;margin-bottom:0}
  .stp{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .stp .nm{flex:1;font-weight:600;font-size:15px}
  .stp .ctl{display:flex;align-items:center;gap:6px}
  .stp .ctl button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:22px;font-weight:700;color:var(--ink)}
  .stp .ctl b{min-width:34px;text-align:center;font:800 30px/1 var(--cond);color:var(--ink)}
  .infos .kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .infos .kv:last-child{border-bottom:0}
  .infos .kv span{color:var(--mut)}
  .infos .kv b{text-align:right;font-weight:600}
  .trow.club{padding:10px 14px}
  .trow.club .nm{flex:1;font-weight:600}
  .trow.club .pos{font:700 16px/1 var(--cond);color:var(--ink)}
  .trow.club sup{font-size:10px}

  /* ---------- Bulle d'aide du bouton thème ---------- */
  header{position:relative}
  .tip{position:absolute;right:12px;top:calc(100% - 6px);z-index:30;width:min(250px,calc(100vw - 24px));background:var(--chip-on);color:#fff;
    border-radius:14px;padding:12px 34px 12px 14px;font-size:14px;line-height:1.35;box-shadow:0 10px 30px rgba(10,36,99,.35);animation:tipIn .3s ease-out}
  .tip::before{content:"";position:absolute;top:-7px;right:26px;width:14px;height:14px;background:inherit;transform:rotate(45deg);border-radius:3px}
  .tip b{display:block;font:800 16px/1.1 var(--cond);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
  .tip .x{position:absolute;top:6px;right:6px;color:#fff;opacity:.8;font-size:16px}
  @keyframes tipIn{from{opacity:0;transform:translateY(-6px)}}
  /* ---------- Pastilles des logos ---------- */

<script>
/* ================= Données ================= */
const KEY = "maincourante_d3hm_a_v1"; // clé conservée pour garder les données déjà saisies
const uid = () => Math.random().toString(36).slice(2, 9);

// Couleurs de club (principale, secondaire)
const KITS = [["#d50000","#ffffff"],["#0d47a1","#ffffff"],["#1b5e20","#ffffff"],["#ffd600","#0a2463"],["#6a1b9a","#ffffff"],
  ["#000000","#ffffff"],["#e65100","#000000"],["#00838f","#ffffff"],["#b71c1c","#ffd600"],["#283593","#ffd600"],["#2e7d32","#ffd600"],["#c2185b","#000000"]];

// Poule réelle : D3 District Haute-Marne – Poule A 2026/2027
// "base" = classement de départ (repris de MyFFF après la 8e journée). Les matchs saisis dans l'app s'ajoutent dessus.
// Couleurs = couleurs des clubs ; les logos officiels s'importent dans Réglages.
function demoData() {
  const T = (name, abbr, c1, c2, J, G, N, P, F, BP, BC, form) =>
    ({ id: uid(), name, abbr, c1, c2, base: { J, G, N, P, F, pen: 0, BP, BC, form } });
  return {
    league: "D3 Haute-Marne – Poule A",
    teams: [
      T("Ornel Chanc. SL 2",      "SLO",  "#d32f2f", "#111111", 8, 7, 1, 0, 0, 31,  6, ["N","V","V"]),
      T("Joinville Vecque FC 2",  "FCJV", "#1e40af", "#facc15", 8, 6, 0, 2, 0, 28,  8, ["D","V","V"]),
      T("Chamouilley Roches",     "ASCR", "#5b21b6", "#facc15", 8, 5, 2, 1, 0, 20,  8, ["V","N","D"]),
      T("Voillecomte US",         "USV",  "#0284c7", "#facc15", 8, 5, 0, 3, 0, 35,  9, ["V","V","D"]),
      T("Montier-en-Der US 2",    "USM",  "#1e3a8a", "#ffffff", 7, 4, 1, 2, 0, 11,  7, ["N"]),
      T("Vaux-sur-Blaise USIB 3", "USIB", "#7e22ce", "#ffffff", 8, 4, 1, 3, 0, 15, 17, ["D","N","V"]),
      T("Sommevoire Roz UJ",      "UJSR", "#15803d", "#111111", 8, 3, 0, 5, 0, 13, 22, ["V","D"]),
      T("Valcourt AF 2",          "AFV",  "#16a34a", "#ffffff", 8, 2, 2, 4, 0,  8, 13, ["N","V","N"]),
      T("Eurville Bienv. DS 2",   "DSEB", "#111111", "#ffffff", 8, 3, 0, 3, 2,  9, 29, ["V","V","D"]),
      T("Marnaval SC 4",          "SCM",  "#15803d", "#dc2626", 8, 1, 2, 5, 0, 12, 27, ["V","N","N"]),
      T("Chevillon Stade 3",      "STC",  "#6d28d9", "#dc2626", 7, 1, 1, 5, 0, 10, 25, ["D","N"]),
      T("Rouvroy FC",             "RFC",  "#facc15", "#1e3a8a", 8, 1, 0, 7, 0,  9, 30, ["D","D","V"]),
    ],
    matches: []
  };
}

let db;
function load() {
  try { db = JSON.parse(localStorage.getItem(KEY)) } catch (e) { db = null }
  if (!db || !db.teams) db = demoData();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)) } catch (e) {} }
load();

const team = id => db.teams.find(t => t.id === id) || { name: "?", id: "?" };
const score = m => m.scoreManuel ? { ...m.scoreManuel } : ({
  h: m.events.filter(e => e.type === "but" && e.side === "home").length,
  a: m.events.filter(e => e.type === "but" && e.side === "away").length
});
const isLive = m => ["1MT", "MT", "2MT"].includes(m.status);
const isASaisir = m => m.status === "AV" && Date.now() > m.date + 2 * 3600000;   // joué, mais score pas encore rentré
const isImminent = m => m.status === "AV" && Date.now() >= m.date - 15 * 60000 && Date.now() <= m.date + 2 * 3600000;
// Match reporté : joué plus de 3 jours après la date habituelle de sa journée
function dateJournee(j) {
  if (db.datesJ && db.datesJ[j]) return db.datesJ[j];          // date habituelle d'après le calendrier complet
  const d = db.matches.filter(m => m.j === j).map(m => m.date).sort((a, b) => a - b);
  return d.length ? d[Math.floor((d.length - 1) / 2)] : 0;
}
const isReporte = m => m.date - dateJournee(m.j) > 3 * 86400000;

/* ================= Écussons générés ================= */
function hash(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h }
const PREFIX = /^(as|fc|us|es|sc|aj|rc|cs|sa|so|ac|ol|olympique|entente|stade|union|racing|sporting|club|js|af|ent\.?)$/i;
const SMALL = /^(de|du|des|la|le|les|d|l|et|sur|en)$/i;
function initials(name) {
  const w = name.replace(/[’']/g, " ").split(/\s+/).filter(Boolean);
  let core = w.filter(x => !PREFIX.test(x) && !SMALL.test(x));
  if (!core.length) core = w;
  return (core.length === 1 ? core[0].slice(0, 3) : core.slice(0, 3).map(x => x[0]).join("")).toUpperCase();
}
function lum(hex) { const n = parseInt(hex.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255 }
let crestN = 0;
// Logo : 1) image importée sur l'appareil, sinon 2) fichier du dépôt logos/<initiales>.png
function crest(t, size = 32, plus = false) {
  const src = t.logo || (t.abbr ? `logos/${t.abbr.toLowerCase()}.png` : null);
  // Logo posé sur une pastille ronde blanche (cache les bords blancs des images, lisible en clair comme en sombre)
  if (src) { const d = Math.round(size * 1.3), i = Math.round(d * 0.76);
    return `<span class="lgo" style="width:${d}px;height:${d}px"><img src="${src}" alt="" style="width:${i}px;height:${i}px"></span>` }
  // Pas de logo : écusson vide (un « + » dans Réglages pour inviter à importer)
  const shape = "M20 1.5 L37.5 6.5 V22 C37.5 34.5 30 42.5 20 46.5 C10 42.5 2.5 34.5 2.5 22 V6.5 Z";
  return `<svg width="${size}" height="${size * 1.2}" viewBox="0 0 40 48" aria-hidden="true" style="flex:none">
    <path d="${shape}" fill="#eef1f6" stroke="#cbd5e1" stroke-width="2"/>
    ${plus ? `<path d="M20 15v16M12 23h16" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>` : ""}</svg>`;
}

/* ================= Chrono ================= */
function minute(m) {
  const now = Date.now();
  if (m.status === "1MT") { const x = Math.floor((now - m.kick1) / 60000) + 1; return x > 45 ? "45+" + (x - 45) : x }
  if (m.status === "2MT") { const x = 45 + Math.floor((now - m.kick2) / 60000) + 1; return x > 90 ? "90+" + (x - 90) : x }
  return null;
}
function minuteNum(m) {
  const v = minute(m); if (v === null) return m.status === "MT" ? 45 : "";
  return String(v).includes("+") ? String(v).split("+").reduce((a, b) => +a + +b) : v;
}
function progress(m) {
  if (m.status === "FIN") return 100;
  if (m.status === "MT") return 50;
  if (!isLive(m)) return 0;
  return Math.min(100, minuteNum(m) / 90 * 100);
}
const fmtDate = d => new Date(d).toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" });
const fmtHour = d => new Date(d).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });

/* ================= Classement ================= */
// Barème FFF amateur : victoire 3 pts, nul 1 pt, défaite 0 pt, forfait -1 pt
function standings(includeLive) {
  const t = {};
  db.teams.forEach(x => {
    const b = x.base || {};
    t[x.id] = { team: x, id: x.id, J: b.J || 0, G: b.G || 0, N: b.N || 0, P: b.P || 0, F: b.F || 0, BP: b.BP || 0, BC: b.BC || 0,
      Pts: 3 * (b.G || 0) + (b.N || 0) - (b.F || 0) - (b.pen || 0), live: false, form: [...(b.form || [])] };
  });
  [...db.matches].sort((a, b) => a.date - b.date).forEach(m => {
    if (m.status === "AV" || m.base) return;
    if (isLive(m) && !includeLive) return;
    const { h, a } = score(m), H = t[m.home], A = t[m.away];
    if (!H || !A) return;
    H.J++; A.J++; H.BP += h; H.BC += a; A.BP += a; A.BC += h;
    if (m.forfait) {                      // forfait : 3 pts au vainqueur, −1 pt à l'équipe forfait
      const W = m.forfait === "home" ? A : H, L = m.forfait === "home" ? H : A;
      W.G++; W.Pts += 3; L.F++; L.Pts -= 1;
    }
    else if (h > a) { H.G++; A.P++; H.Pts += 3 } else if (h < a) { A.G++; H.P++; A.Pts += 3 } else { H.N++; A.N++; H.Pts++; A.Pts++ }
    if (isLive(m)) { H.live = A.live = true }
    else { H.form.push(h > a ? "V" : h < a ? "D" : "N"); A.form.push(a > h ? "V" : a < h ? "D" : "N") }
  });
  return Object.values(t).sort((x, y) =>
    y.Pts - x.Pts || (y.BP - y.BC) - (x.BP - x.BC) || y.BP - x.BP || x.team.name.localeCompare(y.team.name));
}

/* ================= Rendu ================= */
const app = document.getElementById("app");
const voletsOuverts = {};
var filtreChoisi = false;   // l'utilisateur a touché un filtre : on ne le change plus tout seul
let tab = "matchs", openId = null, filter = "av";

const DISCLAIMER = `<p class="disclaimer">Application non officielle, sans lien avec la FFF ni le District de Haute-Marne.</p>`;
function render() {
  crestN = 0;
  document.getElementById("sub").textContent = db.league;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab && !openId || (openId && b.dataset.tab === "matchs")));
  document.getElementById("navdot").hidden = !db.matches.some(m => isLive(m) || isImminent(m));
  if (openId) { renderMatch(db.matches.find(m => m.id === openId)); if (openId) app.insertAdjacentHTML("beforeend", DISCLAIMER); return }
  if (tab === "matchs") renderMatchs();
  if (tab === "classement") renderTable();
  if (tab === "reglages") renderSettings();
  app.insertAdjacentHTML("beforeend", DISCLAIMER);
}

function matchRow(m) {
  const s = score(m), H = team(m.home), A = team(m.away), lv = isLive(m);
  let right;
  if (lv) right = m.status === "MT" ? `<span class="live">Mi-temps</span>` : `<span class="live">${minute(m)}'</span>`;
  else if (isImminent(m)) right = `<span class="soon">Coup d'envoi ${fmtHour(m.date)}</span>`;
  else if (isASaisir(m)) right = `<span class="soon">Score à saisir</span>`;
  else if (m.status === "FIN") right = `<span>Terminé</span>`;
  else right = `<span>${fmtDate(m.date)}</span>`;
  const line = (t, g, lose) => `<div class="team ${lose ? "lose" : ""}">${crest(t, 24)}<span class="nm">${esc(t.name)}</span>
    ${m.status === "AV" ? "" : `<span class="g">${g}</span>`}</div>`;
  const kick = m.status === "AV" && !isASaisir(m);
  return `<button class="m ${lv ? "islive" : ""}" onclick="openMatch('${m.id}')">
    <div class="top"><span>Journée ${m.j}${isReporte(m) ? ` <span class="rep">Reporté</span>` : ""}${m.forfait ? ` <span class="rep">Forfait ${esc(short(team(m.forfait === "home" ? m.home : m.away).name))}</span>` : ""}</span>${right}</div>
    <div style="display:flex;align-items:center;gap:12px"><div style="flex:1">
      ${line(H, s.h, m.status === "FIN" && s.h < s.a)}${line(A, s.a, m.status === "FIN" && s.a < s.h)}
    </div>${kick ? `<div class="kick">${fmtHour(m.date)}</div>` : ""}</div>
    ${lv ? `<div class="bar"><i style="width:${progress(m)}%"></i></div>` : ""}
  </button>`;
}

function renderMatchs() {
  const live = db.matches.filter(m => isLive(m) || isImminent(m)).sort((a, b) => a.date - b.date);
  const next = db.matches.filter(m => m.status === "AV" && !isImminent(m) && !isASaisir(m)).sort((a, b) => a.date - b.date);
  const fin = db.matches.filter(m => m.status === "FIN" || isASaisir(m)).sort((a, b) => b.j - a.j || a.date - b.date);
  const nbSaisir = fin.filter(isASaisir).length;
  const chip = (k, l, n) => `<button class="chip ${filter === k ? "on" : ""}" onclick="filter='${k}';filtreChoisi=true;render()">${l}${n ? `<span class="n">${n}</span>` : ""}</button>`;
  // Dans « Tout » : chaque section est un volet dépliant
  const fold = (key, title, list, extra = "", ouvert = false) => {
    if (!list.length) return "";
    const open = key in voletsOuverts ? voletsOuverts[key] : ouvert;
    return `<details class="fold" ${open ? "open" : ""} ontoggle="voletsOuverts['${key}']=this.open">
      <summary><h2>${title}</h2><span class="cnt">${extra}${extra ? " · " : ""}${list.length} match${list.length > 1 ? "s" : ""}</span><i class="chev"></i></summary>
      <div class="card">${list.map(matchRow).join("")}</div></details>`;
  };
  const block = (title, list, extra = "") => list.length ? `<div class="sec"><h2>${title}</h2>${extra}</div><div class="card">${list.map(matchRow).join("")}</div>` : "";
  let html = `<div class="chips">${chip("live", "En direct", live.length)}${chip("av", "À venir")}${chip("fin", "Résultats")}${chip("tout", "Tout")}</div>`;
  if (filter === "tout" || filter === "live") html += block("En direct", live, `<span class="live">Live</span>`);
  if (filter === "tout" || filter === "av") {
    // Journées rangées par date ; un match reporté est rangé dans la journée qui couvre sa nouvelle date
    const byJ = {}; next.filter(m => !isReporte(m)).forEach(m => (byJ[m.j] = byJ[m.j] || []).push(m));
    let js = Object.keys(byJ).sort((a, b) => dateJournee(+a) - dateJournee(+b));
    const rep = {};
    next.filter(isReporte).forEach(m => {
      let cible = js[0];
      js.forEach(j => { if (dateJournee(+j) <= m.date) cible = j });
      if (cible === undefined) { cible = String(m.j); js = [cible] }
      (byJ[cible] = byJ[cible] || []).push(m); rep[cible] = (rep[cible] || 0) + 1;
    });
    js.forEach(j => byJ[j].sort((a, b) => a.date - b.date));
    const info = j => fmtDate(dateJournee(+j)) + (rep[j] ? ` · <span class="rep">+${rep[j]} reporté${rep[j] > 1 ? "s" : ""}</span>` : "");
    if (filter === "av") js.slice(0, 1).forEach(j => html += block(`Prochaine journée · J${j}`, byJ[j], `<span class="note" style="margin:0">${info(j)}</span>`));
    else js.forEach((j, i) => html += fold(`av${j}`, `${i === 0 ? "Prochaine journée · " : ""}J${j}`, byJ[j], info(j), i === 0));
    if (filter === "av" && js.length > 1)
      html += `<button class="btn full" style="margin-bottom:6px" onclick="filter='tout';render();scrollTo(0,0)">Voir tout le calendrier (${next.length} matchs)</button>`;
  }
  if (filter === "tout" || filter === "fin") {
    const byJ = {}; fin.forEach(m => (byJ[m.j] = byJ[m.j] || []).push(m));
    Object.keys(byJ).sort((a, b) => b - a).forEach((j, i) => html += filter === "tout"
      ? fold(`fin${j}`, `Résultats · J${j}`, byJ[j], "", false)
      : block(`Journée ${j}`, byJ[j], `<span class="note" style="margin:0">Résultats</span>`));
  }
  if (!db.matches.length) html += `<div class="card"><div class="empty">Le calendrier se charge…</div></div>`;
  else if (filter === "live" && !live.length) html += `<div class="card"><div class="empty">Aucun match en direct.<br>Ouvre un match à venir et lance le coup d'envoi.</div></div>`;

  app.innerHTML = html;
}

function renderTable() {
  const live = standings(true), before = standings(false);
  const posBefore = {}; before.forEach((r, i) => posBefore[r.id] = i);
  const anyLive = db.matches.some(isLive), n = live.length;
  app.innerHTML = `
    <div class="sec"><h2>Classement</h2>${anyLive ? `<span class="live">En direct</span>` : ""}</div>
    <div class="card"><table>
      <thead><tr><th>#</th><th class="n">Équipe</th><th>Pts</th><th>J</th><th class="hide-s">G</th><th class="hide-s">N</th><th class="hide-s">P</th><th class="hide-s">F</th><th>Diff</th><th>Forme</th></tr></thead><tbody>
      ${live.map((r, i) => {
        const d = posBefore[r.id] - i, diff = r.BP - r.BC;
        const mv = anyLive && d > 0 ? `<span class="mv u">▲${d}</span>` : anyLive && d < 0 ? `<span class="mv d">▼${-d}</span>` : "";
        const zone = i === 0 ? "up1" : i === n - 1 ? "dn1" : "";
        return `<tr class="${zone} ${r.live ? "lv" : ""}">
          <td class="pos">${i + 1}</td>
          <td class="n"><div class="w">${crest(r.team, 20)}<span class="t">${esc(r.team.name)}</span>${mv}</div></td>
          <td class="pts">${r.Pts}</td><td>${r.J}</td><td class="hide-s">${r.G}</td><td class="hide-s">${r.N}</td><td class="hide-s">${r.P}</td><td class="hide-s">${r.F}</td>
          <td style="font-weight:600;color:${diff > 0 ? "var(--green)" : diff < 0 ? "var(--red)" : "inherit"}">${diff > 0 ? "+" + diff : diff}</td>
          <td><div class="form">${r.form.slice(-3).map(f => `<i class="${f}">${f}</i>`).join("")}</div></td></tr>`;
      }).join("")}
    </tbody></table></div>
    <div class="legend"><span class="a">Montée</span><span class="b">Descente</span>${anyLive ? `<span class="c">Match en cours</span>` : ""}</div>
    <p class="note">Victoire 3 pts · Nul 1 pt · Défaite 0 pt · Forfait −1 pt. À égalité : différence de buts, puis buts marqués.
    ${anyLive ? "<br>Le classement en direct compte les matchs en cours comme s'ils s'arrêtaient maintenant. ▲▼ = places gagnées ou perdues grâce au live." : ""}</p>`;
}

function renderMatch(m) {
  if (!m) { openId = null; return render() }
  const s = score(m), H = team(m.home), A = team(m.away);
  let badge;
  if (isASaisir(m)) badge = `<span class="badge mt">SCORE À SAISIR · ${fmtDate(m.date)}</span>`;
  else if (m.status === "AV") badge = isImminent(m) ? `<span class="badge mt">COUP D'ENVOI IMMINENT · ${fmtHour(m.date)}</span>` : `<span class="badge av">${fmtDate(m.date)} · ${fmtHour(m.date)}</span>`;
  else if (m.status === "MT") badge = `<span class="badge mt">MI-TEMPS</span>`;
  else if (m.status === "FIN") badge = m.forfait
    ? `<span class="badge mt">FORFAIT · ${esc(team(m.forfait === "home" ? m.home : m.away).name)}</span>`
    : `<span class="badge fin">TERMINÉ</span>`;
  else badge = `<span class="badge lv">${minute(m)}'</span>`;

  let ctrl = "";
  const scoreur = peutSaisir(m);
  if (m.status === "AV") ctrl = isASaisir(m)
    ? `<button class="btn p full" onclick="saisirScore()">✎ Saisir le score final</button>`
    : `<button class="btn g full" onclick="setStatus('1MT')">▶ Coup d'envoi</button>`;
  if (m.status === "1MT") ctrl = `<button class="btn dark full" onclick="setStatus('MT')">⏸ Siffler la mi-temps</button>`;
  if (m.status === "MT") ctrl = `<button class="btn g full" onclick="setStatus('2MT')">▶ Reprise 2e mi-temps</button>`;
  if (m.status === "2MT") ctrl = `<button class="btn dark full" onclick="setStatus('FIN')">⏹ Siffler la fin du match</button>`;
  if (m.status === "FIN") ctrl = m.officiel
    ? `<p class="note" style="margin:0;text-align:center">✓ Résultat officiel</p>`
    : m.scoreManuel
    ? `<button class="btn full" onclick="saisirScore()">✎ Modifier le score</button>`
    : `<button class="btn full" onclick="setStatus('2MT')">↩ Rouvrir le match</button>`;
  if (!scoreur) ctrl = m.officiel && m.status === "FIN" ? `<p class="note" style="margin:0;text-align:center">✓ Résultat officiel</p>`
    : isLive(m) ? `<p class="note" style="margin:0;text-align:center"><span class="live">En direct</span> · le score se met à jour tout seul</p>`
    : m.status === "FIN" ? `<p class="note" style="margin:0;text-align:center">Match terminé</p>`
    : isASaisir(m) ? `<p class="note" style="margin:0;text-align:center">Score pas encore saisi</p>`
    : `<p class="note" style="margin:0;text-align:center">Coup d'envoi prévu le ${fmtDate(m.date)} à ${fmtHour(m.date)}</p>`;
  const canEdit = scoreur && (isLive(m) || (m.status === "FIN" && !m.scoreManuel));
  // Bloc scoreur : qui saisit, « Je suis au match », reprendre la main, signaler, outils admin
  const ouvert = (isLive(m) || isImminent(m)) && !m.officiel;
  const typeS = s => s.type === "club" ? "scoreur officiel" : s.type === "admin" ? "administrateur" : s.type === "invite" ? "invité par l'administrateur" : "supporter";
  let blocS = "";
  if (m.scoreur) blocS += `<p class="note" style="margin:0 0 8px;text-align:center">✍️ Score saisi par <b>${esc(m.scoreur.pseudo)}</b> · ${typeS(m.scoreur)}</p>`;
  if (!scoreur && ouvert && !m.scoreur && window.firebase) blocS += `<button class="btn g full" onclick="jeSuisAuMatch()">🙋 Je suis au match, je saisis le score</button>`;
  if (fbUser && m.scoreur && m.scoreur.uid !== fbUser.uid && (estAdmin() || (monClub && clubsDu(m).includes(monClub))) && !m.officiel)
    blocS += `<button class="btn full" style="margin-top:8px" onclick="reprendreMain()">Reprendre la main</button>`;
  if (!scoreur && !m.officiel && window.firebase && Date.now() <= m.date + H3) blocS += `<button class="lien" onclick="jaiUnCode()">🎟️ J'ai un code pour ce match</button>`;
  if (!scoreur && m.scoreur && !m.officiel) blocS += `<button class="lien" style="margin-top:2px" onclick="signaler()">⚠️ Signaler une erreur de score</button>`;
  if (estAdmin() && m.uid) {
    const nb = Object.keys((signalements || {})[m.uid] || {}).length;
    const cm = codesMatch[m.uid];
    blocS += `<div class="admin">
      <div class="codem"><span>🎟️ Code du match</span>${cm ? `<code>${codeMatchFmt(cm)}</code>` : ""}
        <button class="btn ${cm ? "" : "p"}" style="padding:7px 12px;font-size:13px;flex:none" onclick="adminCodeMatch()">${cm ? "Nouveau" : "Générer"}</button></div>
      ${nb ? `<p class="note" style="margin:0 0 8px;color:var(--red);font-weight:700">⚠️ ${nb} signalement${nb > 1 ? "s" : ""} sur ce match <button class="lien" style="display:inline;margin:0" onclick="adminSignalementsVus()">(marquer comme vu)</button></p>` : ""}
      <div class="row">${m.scoreur ? `<button class="btn" onclick="adminRetirerScoreur()">Retirer le scoreur</button>` : ""}
      ${m.distant ? `<button class="btn r" onclick="adminReset()">Remettre à zéro</button>` : ""}</div></div>`;
  }

  // Fil du match
  const evs = [...m.events].sort((a, b) => a.min - b.min);
  const icon = e => e.type === "but" ? "⚽" : e.type === "jaune" ? "🟨" : "🟥";
  const lbl = e => e.type === "but" ? "But" : e.type === "jaune" ? "Carton jaune" : "Carton rouge";
  let run = { h: 0, a: 0 }, tl = "", mtShown = false;
  if (m.forfait) tl = `<div class="phase"><span>Match non joué · victoire par forfait (3-0)</span></div>`;
  else if (m.scoreManuel && !m.events.length) tl = `<div class="phase"><span>Score final saisi après le match</span></div>`;
  else if (m.status !== "AV") tl += `<div class="phase"><span>Coup d'envoi</span></div>`;
  evs.forEach(e => {
    if (!mtShown && e.min > 45 && m.status !== "1MT") { tl += `<div class="phase"><span>Mi-temps ${run.h} - ${run.a}</span></div>`; mtShown = true }
    if (e.type === "but") e.side === "home" ? run.h++ : run.a++;
    const body = `${e.side === "home" ? "" : icon(e)}<span><b>${esc(e.who || lbl(e))}</b>${e.type === "but" ? `<small>${run.h} - ${run.a}</small>` : e.who ? `<small>${lbl(e)}</small>` : ""}</span>${e.side === "home" ? icon(e) : ""}`;
    tl += `<div class="ev ${e.type === "but" ? "g" : ""}">
      <div class="tx h">${e.side === "home" ? body : ""}</div><div class="min">${e.min}'</div><div class="tx">${e.side === "away" ? body : ""}</div></div>`;
  });
  if (!mtShown && !m.scoreManuel && ["MT", "2MT", "FIN"].includes(m.status)) tl += `<div class="phase"><span>Mi-temps ${run.h} - ${run.a}</span></div>`;
  if (m.status === "FIN" && !m.scoreManuel) tl += `<div class="phase"><span>Fin du match</span></div>`;

  app.innerHTML = `
    <div class="hero">
      <div class="tp"><button class="back" onclick="openId=null;render()">‹ Matchs</button><span style="font-size:12px;opacity:.75">Journée ${m.j}</span>${isReporte(m) ? ` <span class="rep">Reporté</span>` : ""}</div>
      <div class="lg">${esc(db.league)}</div>
      <div class="duel">
        <div class="tm">${crest(H, 56)}<span>${esc(H.name)}</span></div>
        <div class="sc">${m.status === "AV" ? `<span style="font-size:40px">${isASaisir(m) ? "– : –" : "VS"}</span>` : `${s.h}<small>-</small>${s.a}`}</div>
        <div class="tm">${crest(A, 56)}<span>${esc(A.name)}</span></div>
      </div>
      <div class="st">${badge}</div>
      ${m.lieu || m.fiche ? `<div class="lieu">${m.lieu ? `📍 ${esc(cap(m.lieu))}` : ""}${m.lieu && m.fiche ? " · " : ""}${m.fiche ? `<a href="${esc(m.fiche)}" target="_blank" rel="noopener">Fiche MyFFF ↗</a>` : ""}</div>` : ""}
      ${isLive(m) || (m.status === "FIN" && !m.scoreManuel) ? `<div class="bar"><i style="width:${progress(m)}%"></i></div><div class="ticks"><span>0'</span><span>45'</span><span>90'</span></div>` : ""}
    </div>

    <div class="card" style="margin-top:12px"><div class="actions">
      ${canEdit ? `<div class="row">
        <button class="goal" onclick="addEvent('but','home')">${crest(H, 22)}<b>But !</b>${esc(short(H.name))}</button>
        <button class="goal" onclick="addEvent('but','away')">${crest(A, 22)}<b>But !</b>${esc(short(A.name))}</button></div>
      <div class="row" style="margin:8px 0 10px">
        <button class="mini" onclick="addEvent('jaune')"><span>🟨</span>Jaune</button>
        <button class="mini" onclick="addEvent('rouge')"><span>🟥</span>Rouge</button>
        <button class="mini" onclick="undo()"><span>↶</span>Annuler</button></div>` : ""}
      ${ctrl}
      ${blocS ? `<div style="margin-top:12px">${blocS}</div>` : ""}
    </div></div>

    <div class="sec"><h2>Fil du match</h2></div>
    <div class="card">${tl ? `<div class="tl">${tl}</div>` : `<div class="empty">Le match n'a pas commencé.</div>`}</div>`;
}

/* ================= Actions ================= */
function openMatch(id) { openId = id; render(); scrollTo(0, 0) }
function cur() { return db.matches.find(m => m.id === openId) }

async function setStatus(st) {
  const m = cur();
  if (st === "FIN" && !await ask("Siffler la fin du match ?", "Terminer")) return;
  if (st === "1MT") m.kick1 = Date.now();
  if (st === "2MT" && m.status === "MT") m.kick2 = Date.now();
  m.status = st; save(); render();
  envoyerChamps(m, { status: st, kick1: m.kick1 || null, kick2: m.kick2 || null });
}

function addEvent(type, side) {
  const m = cur(), H = team(m.home), A = team(m.away);
  const dlg = document.getElementById("dlg");
  const title = type === "but" ? "⚽ But !" : type === "jaune" ? "🟨 Carton jaune" : "🟥 Carton rouge";
  dlg.innerHTML = `<form method="dialog">
    <h3>${title}</h3>
    ${side ? `<div style="display:flex;align-items:center;gap:8px;margin-top:8px">${crest(side === "home" ? H : A, 22)}<b>${esc((side === "home" ? H : A).name)}</b></div>`
      : `<label>Équipe</label><div class="seg"><input type="radio" name="sd" id="sdh" value="home" checked><label for="sdh">${esc(short(H.name))}</label>
         <input type="radio" name="sd" id="sda" value="away"><label for="sda">${esc(short(A.name))}</label></div>`}
    <label>Joueur (facultatif)</label><input type="text" id="f-who" placeholder="Nom ou numéro">
    <label>Minute</label><input id="f-min" type="number" inputmode="numeric" value="${minuteNum(m)}">
    <div class="row" style="margin-top:16px"><button class="btn" value="no">Annuler</button><button class="btn ${type === "but" ? "g" : "p"}" value="ok">Valider</button></div>
  </form>`;
  dlg.returnValue = ""; dlg.showModal();
  dlg.onclose = () => {
    if (dlg.returnValue !== "ok") return;
    const sd = side || dlg.querySelector("input[name=sd]:checked").value;
    const ev = { type, side: sd, min: +dlg.querySelector("#f-min").value || 0, who: dlg.querySelector("#f-who").value.trim(), t: Date.now() };
    const loc = { ...ev, id: uid() }; m.events.push(loc); save(); render();
    envoyerEvent(m, ev).then(k => { if (k) loc.id = k });
  };
}

// Saisie du score final (match joué sans direct, ou résultat officiel FFF)
function saisirScore() {
  const m = cur(), H = team(m.home), A = team(m.away), sc = m.scoreManuel || { h: 0, a: 0 };
  const dlg = document.getElementById("dlg");
  const stepper = (k, t, v) => `<div class="stp">${crest(t, 30)}<span class="nm">${esc(t.name)}</span>
    <div class="ctl"><button type="button" onclick="stp('${k}',-1)">−</button><b id="sc-${k}">${v}</b><button type="button" onclick="stp('${k}',1)">+</button></div></div>`;
  dlg.innerHTML = `<form method="dialog"><h3>Score final</h3>
    <p class="note" style="margin:4px 0 12px">Journée ${m.j} · ${fmtDate(m.date)}</p>
    ${stepper("h", H, sc.h)}${stepper("a", A, sc.a)}
    <div class="row" style="margin-top:16px"><button class="btn" value="no">Annuler</button><button class="btn p" value="ok">Enregistrer</button></div>
    ${m.scoreManuel ? `<button class="btn r full" style="margin-top:8px" value="del">Effacer le score</button>` : ""}</form>`;
  dlg.returnValue = ""; dlg.showModal();
  dlg.onclose = () => {
    if (dlg.returnValue === "ok") {
      m.scoreManuel = { h: +dlg.querySelector("#sc-h").textContent, a: +dlg.querySelector("#sc-a").textContent };
      m.status = "FIN";
    } else if (dlg.returnValue === "del") { delete m.scoreManuel; m.status = "AV" }
    else return;
    save(); render();
    envoyerChamps(m, { scoreManuel: m.scoreManuel || null, status: m.status });
  };
}
// Scores publiés dans le dépôt (data/resultats.json) : visibles par tout le monde
async function syncResultats() {
  let data; try { const r = await fetch("data/resultats.json", { cache: "no-store" }); if (!r.ok) return; data = await r.json() } catch (e) { return }
  let change = false;
  for (const m of db.matches) {
    const sc = m.uid && data[m.uid]; if (!sc || isLive(m)) continue;
    const forfait = sc[2] === "Fh" ? "home" : sc[2] === "Fa" ? "away" : null;   // équipe qui a déclaré forfait
    if (!m.scoreManuel || m.scoreManuel.h !== sc[0] || m.scoreManuel.a !== sc[1] || !m.officiel || (m.forfait || null) !== forfait) {
      m.scoreManuel = { h: sc[0], a: sc[1] }; m.officiel = true; m.status = "FIN"; m.events = m.events || [];
      if (forfait) m.forfait = forfait; else delete m.forfait;
      change = true;
    }
  }
  if (change) { save(); if (!document.querySelector("dialog[open]")) render() }
}
function stp(k, d) { const el = document.getElementById("sc-" + k); el.textContent = Math.max(0, Math.min(30, +el.textContent + d)) }
function undo() {
  const m = cur(); if (!m.events.length) return;
  const last = [...m.events].sort((a, b) => (a.t || 0) - (b.t || 0)).pop();
  m.events = m.events.filter(e => e !== last); save(); render(); retirerEvent(m, last.id);
}
async function delMatch() { if (!await ask("Supprimer ce match ?", "Supprimer")) return; const mm = cur(); if (mm && mm.uid) { db.masques = db.masques || []; db.masques.push(mm.uid) }
  db.matches = db.matches.filter(m => m.id !== openId); openId = null; save(); render() }

function newMatch() {
  const opts = db.teams.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join("");
  const nextJ = Math.max(1, ...db.matches.map(m => m.j), ...db.teams.map(t => (t.base && t.base.J || 0) + 1));
  const d = new Date(Date.now() + 3600000); d.setMinutes(0, 0, 0);
  const local = new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  const dlg = document.getElementById("dlg");
  dlg.innerHTML = `<form method="dialog">
    <h3>Nouveau match</h3>
    <label>Domicile</label><select id="f-h">${opts}</select>
    <label>Extérieur</label><select id="f-a">${opts}</select>
    <div class="row"><div><label>Journée</label><input id="f-j" type="number" inputmode="numeric" value="${nextJ}"></div>
    <div style="flex:2"><label>Date et heure</label><input id="f-d" type="datetime-local" value="${local}"></div></div>
    <div class="row" style="margin-top:16px"><button class="btn" value="no">Annuler</button><button class="btn p" value="ok">Créer</button></div>
  </form>`;
  dlg.querySelector("#f-a").selectedIndex = 1;
  dlg.returnValue = ""; dlg.showModal();
  dlg.onclose = () => {
    if (dlg.returnValue !== "ok") return;
    const h = dlg.querySelector("#f-h").value, a = dlg.querySelector("#f-a").value;
    if (h === a) return ask("Choisis deux équipes différentes.", null);
    db.matches.push({ id: uid(), j: +dlg.querySelector("#f-j").value || 1, home: h, away: a,
      date: new Date(dlg.querySelector("#f-d").value).getTime() || Date.now(), status: "AV", kick1: null, kick2: null, events: [] });
    save(); render();
  };
}

function addTeam() {
  const v = document.getElementById("nt").value.trim(); if (!v) return;
  const k = KITS[hash(v) % KITS.length];
  db.teams.push({ id: uid(), name: v, c1: k[0], c2: k[1], base: { J: 0, G: 0, N: 0, P: 0, F: 0, pen: 0, BP: 0, BC: 0, form: [] } }); save(); render();
}
function renameTeam(id, v) { const t = db.teams.find(x => x.id === id); if (t && v.trim()) { t.name = v.trim(); save(); render() } }
function setColor(id, k, v) { const t = db.teams.find(x => x.id === id); if (t) { t[k] = v; save(); render() } }
// Import d'un logo : redimensionné à 160 px max pour rester léger
function importLogo(id, input) {
  const f = input.files && input.files[0]; if (!f) return;
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = () => {
    const k = Math.min(1, 160 / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const t = db.teams.find(x => x.id === id); if (!t) return;
    t.logo = c.toDataURL("image/png"); save(); render();
  };
  img.onerror = () => ask("Impossible de lire cette image.", null);
  img.src = url;
}
function delTeam(id) {
  if (db.matches.some(m => m.home === id || m.away === id)) return ask("Cette équipe a des matchs. Supprime d'abord ses matchs.", null);
  db.teams = db.teams.filter(t => t.id !== id); save(); render();
}

/* ================= Utilitaires ================= */
function cap(s) { return String(s).toLowerCase().replace(/(^|[\s'-])\S/g, c => c.toUpperCase()) }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])) }
function short(n) { const w = n.split(" "); return w.length > 1 && PREFIX.test(w[0]) ? w.slice(1).join(" ") : n }

// Fenêtre de confirmation intégrée (remplace confirm/alert). okLabel = null → simple message.
function ask(msg, okLabel = "Confirmer") {
  const d = document.getElementById("ask");
  d.innerHTML = `<form method="dialog"><p style="margin:4px 0 16px;font-size:16px;font-weight:500">${esc(msg)}</p>
    <div class="row">${okLabel ? `<button class="btn" value="no">Annuler</button><button class="btn r" value="ok">${esc(okLabel)}</button>`
      : `<button class="btn p" value="no">OK</button>`}</div></form>`;
  d.returnValue = ""; d.showModal();
  return new Promise(res => d.onclose = () => res(d.returnValue === "ok"));
}

/* ================= Calendrier MyFFF (data/matchs.json, mis à jour chaque jour par GitHub) ================= */
// Le classement de départ s'arrête à la 8e journée : les matchs d'avant sont importés (pour les résultats)
// mais ne comptent pas une 2e fois dans le classement.
const DEBUT_IMPORT = Date.parse("2026-11-09T00:00:00+01:00");
const norm = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().replace(/[^A-Z0-9]+/g, " ").trim();
async function syncCalendrier() {
  let data;
  try { const r = await fetch("data/matchs.json", { cache: "no-store" }); if (!r.ok) return; data = await r.json() } catch (e) { return }
  const byName = {}; db.teams.forEach(t => byName[norm(t.name)] = t.id);
  db.masques = db.masques || [];
  if (data.maj && db.majCal !== data.maj) { db.majCal = data.maj; save() }
  // Date habituelle de chaque journée (médiane de tous ses matchs, saison complète)
  const parJ = {}; (data.matchs || []).forEach(f => (parJ[f.j] = parJ[f.j] || []).push(Date.parse(f.date)));
  const datesJ = {}; for (const j in parJ) { const d = parJ[j].sort((a, b) => a - b); datesJ[j] = d[Math.floor((d.length - 1) / 2)] }
  let change = JSON.stringify(datesJ) !== JSON.stringify(db.datesJ || {});
  db.datesJ = datesJ;
  for (const f of data.matchs || []) {
    const t = Date.parse(f.date), base = t < DEBUT_IMPORT;    // base = déjà compté dans le classement de départ
    const home = byName[norm(f.domicile)], away = byName[norm(f.exterieur)];
    if (!home || !away || db.masques.includes(f.uid)) continue;
    const m = db.matches.find(x => x.uid === f.uid);
    if (m) {
      if (m.status === "AV" && (m.date !== t || m.lieu !== f.lieu || m.base !== base)) { Object.assign(m, { date: t, j: f.j, lieu: f.lieu, fiche: f.fiche, home, away, base }); change = true }
    } else {
      db.matches.push({ id: uid(), uid: f.uid, j: f.j, home, away, date: t, lieu: f.lieu, fiche: f.fiche, base, status: "AV", kick1: null, kick2: null, events: [] });
      change = true;
    }
  }
  if (change) { save(); if (!document.querySelector("dialog[open]")) render() }
}

// Les affiches (qui joue contre qui, et quand) servent aux règles de sécurité : c'est l'admin qui les publie
async function syncAffiches() {
  if (!fbDb || !estAdmin() || !db.matches.some(m => m.uid)) return;
  const voulu = {}; db.matches.forEach(m => { if (m.uid) voulu[m.uid] = { h: team(m.home).abbr, a: team(m.away).abbr, t: m.date } });
  try {
    const actuel = (await fbDb.ref("affiches").once("value")).val() || {};
    const diff = {}; for (const k in voulu) if (JSON.stringify(actuel[k]) !== JSON.stringify(voulu[k])) diff[k] = voulu[k];
    if (Object.keys(diff).length) await fbDb.ref("affiches").update(diff);
  } catch (e) { console.warn("affiches", e) }

// Applique l'état reçu de Firebase (les résultats officiels du dépôt restent prioritaires)
function appliquerDistant() {
  let change = false;
  for (const m of db.matches) {
    if (!m.uid || m.officiel) continue;
    const d = distant[m.uid];
    if (!d) {                                           // match remis à zéro par l'admin
      if (m.distant) { Object.assign(m, { status: "AV", kick1: null, kick2: null, events: [] }); delete m.scoreManuel; delete m.forfait; delete m.scoreur; delete m.distant; change = true }
      continue;
    }
    const ev = Object.entries(d.events || {}).filter(([, v]) => v).map(([k, v]) => ({ ...v, id: k })).sort((x, y) => (x.t || 0) - (y.t || 0));
    const nouv = { status: d.status || "AV", kick1: d.kick1 || null, kick2: d.kick2 || null, events: ev,
                   scoreManuel: d.scoreManuel || undefined, forfait: d.forfait || undefined, scoreur: d.scoreur || undefined };
    const cle = o => JSON.stringify([o.status, o.kick1, o.kick2, o.events, o.scoreManuel, o.forfait, o.scoreur]);
    if (!m.distant || cle(m) !== cle(nouv)) {
      Object.assign(m, nouv, { distant: true });
      ["scoreManuel", "forfait", "scoreur"].forEach(k => { if (!nouv[k]) delete m[k] });
      change = true;
    }
  }
  if (change) { save(); rafraichir() }
}

async function prendreMainSiLibre(m) {                  // club ou admin : se déclarer scoreur si personne ne l'est
  if (m.scoreur || !fbUser) return;
  if (estInvite(m) && !estAdmin() && !(monClub && clubsDu(m).includes(monClub))) return;   // l'invité a déjà pris la main en entrant le code
  const s = estAdmin() ? { uid: fbUser.uid, pseudo: "Administrateur", type: "admin" }
                       : { uid: fbUser.uid, pseudo: team(clubsDu(m)[0] === monClub ? m.home : m.away).name, type: "club", club: monClub };
  await refM(m).child("scoreur").set({ ...s, t: firebase.database.ServerValue.TIMESTAMP });

  catch (e) { erreurEnvoi(e) }
}
async function envoyerEvent(m, ev) {
  if (!fbDb || !peutSaisir(m)) return null;
  try { await prendreMainSiLibre(m); const r = refM(m).child("events").push(); await r.set(ev); return r.key }
  catch (e) { erreurEnvoi(e); return null }
}
async function retirerEvent(m, id) {

// ---------- Codes club ----------
// Code club : 3 premières lettres du club + « - » + 4 chiffres, chiffres tous différents d'un club à l'autre (ex. CHA-4821)
function prefixe(t) { return t.name.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().replace(/[^A-Z]/g, "").slice(0, 3) }
const formatOk = (t, c) => typeof c === "string" && new RegExp(`^${prefixe(t)}-\\d{4}$`).test(c);
function genCode(abbr, pris) {
  const t = db.teams.find(x => x.abbr === abbr); let n;
  do { n = String(Math.floor(1000 + Math.random() * 9000)) } while (pris.has(n));
  pris.add(n); return `${prefixe(t)}-${n}`;
}
// Admin : crée automatiquement les codes manquants (ou à l'ancien format) pour tous les clubs
async function codesAuto() {
  if (!fbDb || !estAdmin() || !db.teams.length) return;
  try {
    const actuels = (await fbDb.ref("codes").once("value")).val() || {};
    const pris = new Set(Object.entries(actuels).filter(([a, c]) => { const t = db.teams.find(x => x.abbr === a); return t && formatOk(t, c) }).map(([, c]) => c.slice(-4)));
    const nouv = {};
    for (const t of db.teams) if (!formatOk(t, actuels[t.abbr])) nouv[t.abbr] = genCode(t.abbr, pris);
    if (Object.keys(nouv).length) await fbDb.ref("codes").update(nouv);
  } catch (e) { console.warn("codes", e) }
}
async function adminNouveauCode(abbr) {
  const t = db.teams.find(x => x.abbr === abbr);
  if (!await ask(`Changer le code de ${t.name} ? Les téléphones qui utilisent l'ancien code perdront l'accès.`, "Changer")) return;
  const pris = new Set(Object.entries(codes).filter(([a]) => a !== abbr).map(([, c]) => String(c).slice(-4)));
  codesVus[abbr] = true;
  fbDb.ref("codes/" + abbr).set(genCode(abbr, pris)).catch(erreurEnvoi);
}
function adminVoirCode(abbr) { codesVus[abbr] = !codesVus[abbr]; render() }
async function entrerCode(f) {
  const err = document.getElementById("codeErr"), code = f.c.value.trim().toUpperCase().replace(/\s+/g, "");
  const t = db.teams.find(x => prefixe(x) === code.split("-")[0]), abbr = t && t.abbr;
  if (!t || !/^[A-Z]{3}-\d{4}$/.test(code)) { err.textContent = "Code incorrect."; return }
  err.textContent = "Vérification…";
  try {
    const u = await connexionAnonyme();
    await fbDb.ref("scoreurs/" + u.uid).set({ club: abbr, code });
    monClub = abbr; err.textContent = ""; render();
  } catch (e) { err.textContent = "Code incorrect ou plus valable." }
}

}

initFirebase();
syncCalendrier().then(syncResultats).then(appliquerDistant).then(() => {
  // Jour de match : ouvrir directement « En direct » une fois le calendrier chargé
  if (!filtreChoisi && db.matches.some(m => isLive(m) || isImminent(m)) && filter !== "live") { filter = "live"; rafraichir() }
}).then(syncAffiches).then(codesAuto);

/* ================= Tuto « Ajouter à l'écran d'accueil » ================= */
const SHARE_ICO = `<span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg></span>`;
const MENU_ICO = `<span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h12M4 17h8"/></svg></span>`;
const PLUS_ICO = `<span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg></span>`;
function installTip() {
  const ua = navigator.userAgent;
  const standalone = window.navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  let seen = false; try { seen = localStorage.getItem("tuto_install_vu") === "1" } catch (e) {}
  if (standalone || seen) return;
  const ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const iosSafari = ios && /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
  let steps = "";
  if (iosSafari) steps = `<ol><li>Touche ${MENU_ICO} dans la barre d'adresse, en bas</li>
      <li>Touche ${SHARE_ICO} <b>Partager</b></li>
      <li>Touche <b>En voir plus</b>, puis ${PLUS_ICO} <b>Sur l'écran d'accueil</b></li>
      <li>Touche <b>Ajouter</b></li></ol>`;
  else if (/Android/.test(ua)) steps = `<ol><li>Touche le menu <b>⋮</b> du navigateur</li><li>Choisis <b>Ajouter à l'écran d'accueil</b> (ou « Installer l'application »)</li></ol>`;
  else return;
  const box = document.createElement("div");
  box.className = "install";
  box.innerHTML = `<button class="cl" aria-label="Fermer">✕</button>
    <div class="hd"><img src="apple-touch-icon.png" alt=""><div><b>Installe l'app</b><span>Retrouve tes matchs en un geste, comme une vraie appli.</span></div></div>
    ${steps}<button class="btn full">Plus tard</button>`;
  const close = () => { box.remove(); try { localStorage.setItem("tuto_install_vu", "1") } catch (e) {} };
  box.querySelector(".cl").onclick = close; box.querySelector(".btn").onclick = close;
  document.body.appendChild(box);
}
if (themeTip()) window._apresTip = installTip;   // une aide à la fois
else setTimeout(installTip, 2500);
</script>
</body>
